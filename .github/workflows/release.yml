# ============================================================================
# dshtui 发布（cargo-dist）—— REQ-008 Step 7 交付 / AC-008-18 发布自动化；
# 依据 Notes/09 P04/P06。本文件由 REQ-008 Step 7 手工按 cargo-dist 现行约定生成
# （tag 触发），代码结构与 cargo-dist 0.32.0 在等价配置上 `dist generate` 的
# 输出逐行一致（经真实 cargo-dist 0.32.0 二进制 + actionlint 验证）。
#
# 版本假设（重要）：
#   - 本任务原始草稿建议 `cargo-dist/action@v0.16.0`；实测 cargo-dist 已弃用
#     该 action（其仓库 `cargo-dist/action` 当前 404 不可解析，2026-09-08 经
#     GitHub API 核实），现行约定（cargo-dist v0.32.0，2026-05 最新稳定版）为
#     自含式编排：curl 安装 dist 二进制 + plan/host JSON manifest 交接。
#   - 因此本文件按 v0.32.0 约定书写，并把 cargo-dist 版本 pin 在
#     Cargo.toml `[workspace.metadata.dist].cargo-dist-version = "0.32.0"`，
#     CI 安装的正是该版本，保证可复现。
#   - 建议后续在装有 cargo-dist 的机器上 `cargo dist init` 重新生成/升级，
#     本文件会被 dist 自动覆盖为权威形态（Always Be Initing）。
#
# 流程：plan → build-local-artifacts（按 [package.metadata.dist] targets 的
# matrix）→ build-global-artifacts（校验和等全局产物）→ host（上传 GitHub
# Releases：预编译二进制归档 + .sha256 + dist-manifest 产物清单）→ announce。
# 产物与平台集合完全由 Cargo.toml 中 metadata.dist（installers=[] /
# targets=["x86_64-unknown-linux-gnu"]）经 `dist plan` 计算驱动。
# ============================================================================

# 该文件由 dist 自动生成（axodotdev/cargo-dist 模板，MIT or Apache-2.0）。
# CI 行为：
# * 检查形如版本的 Git Tag
# * 用 dist 构建产物（归档 / installer / 校验和）
# * 上传到临时 workflow 归档
# * 成功后上传到 GitHub Release（title/body 依据 changelog 自动生成）
name: Release

# 发布 job 需要写 Release 的权限；只在此 workflow 开放。
permissions:
  "contents": "write"

# 触发：push 形如版本的 git tag，如 "1.0.0"、"v0.1.0-prerelease.1"、
# "dshtui-v1.0.0"、"releases/v1.0.0" 等（都会被解析为 VERSION + 可选
# PACKAGE_NAME）。本仓库单包，未带 PACKAGE_NAME 时按该版本发布 dist 包。
# 版本带 prerelease 后缀则 GitHub Release 标记为 prerelease。
# 另开 pull_request：默认 pr-run-mode=plan，PR 上只跑 plan 校验发布流程
# 可生成，不真构建（见 plan job 的 publish 分支）。
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # ---------------------------------------------------------------------------
  # plan：运行 'dist plan'（tag push 时实为 'host --steps=create'，预创建 release
  # 并算出 artifacts_matrix / 版本信息）→ 输出 manifest 供后续 job 消费。
  # ---------------------------------------------------------------------------
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # 安装与 Cargo.toml cargo-dist-version 一致的 dist 版本。
      # 指定 bash 以启用 pipefail：防止 curl 失败被 sh 吞掉而继续。
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      # 缓存 dist 二进制，供 build/host job 复用（经 workflow artifact）。
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # tag push → host --steps=create（预创建 release 并产出 matrix）；
      # PR → plan。manifest 交给后续 job。
      - id: plan
        run: |
          dist ${{ (!github.event.pull_request && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # ---------------------------------------------------------------------------
  # build-local-artifacts：按 plan manifest 的 artifacts_matrix（由 metadata.dist
  # targets 决定，V1 仅 x86_64-unknown-linux-gnu）为每个平台编译并打归档。
  # ---------------------------------------------------------------------------
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # 让 plan 决定是否运行（matrix 为空或非 upload 模式时整体跳过）。
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # 平台/runner 由 dist 在 create-release 阶段计算。matrix 成员含：
      #   runner / dist-args / install-dist / packages_install / cache_provider
      # 一般有：1 个 "global" 任务（通用 installer）+ N 个 "local" 任务
      # （各平台二进制与平台专属 installer）。
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # container runner（自定义镜像）里未必预装 Rust，非交互安装。
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # 取回 plan manifest（幂等缓存产物）。
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      # 真正构建并打 zip/tar（dist build，含归档与 installer/校验和）。
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # 强制 bash：把产物路径从 manifest 提到 GITHUB_OUTPUT。
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ---------------------------------------------------------------------------
  # build-global-artifacts：平台无关的全局产物（校验和汇总、源码包等）。
  # ---------------------------------------------------------------------------
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      # 复用 plan job 缓存的 dist 二进制。
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # 取回所有 local 产物供全局任务使用（如生成校验和）。
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ---------------------------------------------------------------------------
  # host：把全部产物上传到 GitHub Release 并创建/充实 Release
  # （预编译二进制 dshtui + .sha256 校验和 + dist-manifest 产物清单）。
  # ---------------------------------------------------------------------------
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # 仅 "publishing"（tag push）且 local/global 都成功（skipped 亦可）时运行。
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # 汇总取回 plan/local/global 产物。
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      # dist host：--steps=upload（把产物推到 GitHub Release）+
      # --steps=release（放行 release）。对 GitHub Releases 而言上传发生在
      # 下方 "Create GitHub Release"。
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # 用 gh release create 创建 GitHub Release 并上传全部产物
      # （artifacts/*：二进制归档 + *.sha256 + manifest）。
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # ---------------------------------------------------------------------------
  # announce：发布成功后的收尾 job（无 publish-jobs 时仅作为编排节点存在，
  # 保持与 cargo-dist 生成结构一致；后续加 publish-jobs 时在此挂接）。
  # ---------------------------------------------------------------------------
  announce:
    needs:
      - plan
      - host
    # "always() && ..." 允许等待全部 publish job 而单个 job 可自行 skip；
    # host 必须完整成功，不允许跳过。
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
