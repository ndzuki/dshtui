# upgrade-signal.yml —— REQ-008 Step F（D-64）：官方 dsh 升级信号 + 24h SLA
# tracking issue + 自动契约冒烟。
#
# 职责：
#   1. 定时（每日）+ 手动：查询官方 @deepseek-ai/dsh 最新 alpha（npm
#      dist-tag `alpha` 为准；GitHub deepseek-ai/deepseek-harness 的
#      dsh-v*alpha* 是其 npm 发布镜像）。
#   2. 与 last-known-good（默认本仓库已锁定的官方基线 0.1.2-rc.1；workflow_
#      dispatch 可覆盖）语义对比。发现新 alpha →
#        a. 若该版本尚无 open 的 upgrade-signal tracking issue → 开一张
#           （版本 / 基线 / 24h SLA 检查项模板 / 本机 web bundle rev 检查项
#           ——CI 无法观测本机 bundle，由维护者在 issue 中确认）；
#        b. 触发契约冒烟 job：跑 scripts/ci-live-smoke.sh 对该 alpha 版本
#           （DSHTUI_ALPHA_VERSION=<detected>）做只读契约表面冒烟——无需仓库
#           secret（实例自身 launch token 由脚本解析）。
#   3. 24h SLA 以 issue 状态跟踪：冒烟 pass + 维护者逐项确认后关闭 issue 即
#      闭合；last-known-good 基线更新是人工动作（下次 dispatch 传参）。
#
# 安全：不引用第三方 secret；GITHUB_TOKEN 默认只读；仅 tracking-issue job 声明
# issues: write。schedule 事件 token 只读级别。
name: upgrade-signal

on:
  schedule:
    # 每日 03:00 UTC（= 11:00 北京时间）检测官方新 alpha。
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      last_known_good:
        description: 基线官方版本（默认 0.1.2-rc.1；新 alpha 与此对比）
        required: false
        default: '0.1.2-rc.1'
      force_version:
        description: 强制指定检测/冒烟的官方版本（跳过 npm 查询；调试用）
        required: false
      skip_smoke:
        description: 只开 tracking issue，不跑契约冒烟（布尔）
        type: boolean
        required: false
        default: false

concurrency:
  group: upgrade-signal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 检测：官方最新 alpha vs last-known-good
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest: ${{ steps.latest.outputs.value }}
      changed: ${{ steps.compare.outputs.changed }}
      baseline: ${{ steps.compare.outputs.baseline }}
    steps:
      - uses: actions/checkout@v7

      - name: 解析官方最新 alpha 版本
        id: latest
        run: |
          if [ -n "$FORCE" ]; then
            echo "force_version 命中：$FORCE"
            echo "value=$FORCE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST="$(npm view @deepseek-ai/dsh@alpha version 2>/dev/null | tail -1 || true)"
          if [ -z "$LATEST" ]; then
            echo "::warning::npm view @deepseek-ai/dsh@alpha 失败（网络/注册表）——本次跳过"
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "官方 alpha dist-tag 当前版本: $LATEST"
          echo "value=$LATEST" >> "$GITHUB_OUTPUT"
        env:
          FORCE: ${{ github.event.inputs.force_version }}

      - name: 与 last-known-good 语义对比
        id: compare
        run: |
          LATEST="$LATEST_VAL"
          BASELINE="${{ github.event.inputs.last_known_good || '0.1.2-rc.1' }}"
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ $? -eq 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          LATEST_VAL: ${{ steps.latest.outputs.value }}

  # ---------------------------------------------------------------------------
  # tracking issue + 契约冒烟（仅新 alpha）
  # ---------------------------------------------------------------------------
  signal:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: 安装 stable Rust（冒烟需要 cargo test）
        uses: dtolnay/rust-toolchain@stable

      - name: 检查该版本是否已有 open tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.latest }}
        run: |
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label upgrade-signal \
            --state open --search "dsh $VERSION" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "已存在 open tracking issue #$EXISTING（版本 $VERSION）——不重复开"
            echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: 开 24h SLA tracking issue
        if: steps.issue.outputs.number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.latest }}
          BASELINE: ${{ needs.detect.outputs.baseline }}
        run: |
          BODY=$(cat <<EOF
          ## 官方 dsh 升级信号：__VERSION__（基线 __BASELINE__）

          **触发**：upgrade-signal 定时/手动检测到官方 @deepseek-ai/dsh 新 alpha __VERSION__。

          **24h SLA 检查项**（请在 issue 内逐项核对后关闭）：
          - [ ] scripts/ci-live-smoke.sh 对该版本契约表面冒烟通过（本 workflow 已自动触发；结果见 workflow run）
          - [ ] scripts/schema-compare.mjs 对 __VERSION__ bundle 出 diff（snapshot 与 schemas/dsh-api-schema-0.1.2-rc.1.json 对比）
          - [ ] export golden / live-export-lock.sh --golden 对 __VERSION__ 复核（新版本 export 行格式变化需更新 fixtures/export-golden/v__VERSION__/）
          - [ ] 本机 web bundle rev 变化无法由 CI 观测——请在**本机**确认 dsh web bundle 版本与 npm alpha 是否同源（维护者人工项）
          - [ ] 破坏性变更已按 Notes/03 §7 分类（删除/改名 → 阻断进修复；新增字段/事件 → 容忍路径）
          - [ ] 关闭本 issue = 该版本已确认/已处理，last-known-good 基线可更新

          > 若 __VERSION__ 修复期超过 24h：保持 issue open 并在评论记录进展；关闭前
          > 不得将 dshtui 宣称兼容该版本。
          EOF
          )
          BODY="${BODY//__VERSION__/$VERSION}"
          BODY="${BODY//__BASELINE__/$BASELINE}"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "upgrade-signal: 官方 dsh $VERSION 升级跟踪（24h SLA）" \
            --label upgrade-signal --body "$BODY"

      - name: 契约冒烟（对该 alpha 版本，无 secret）
        if: ${{ !github.event.inputs.skip_smoke }}
        run: |
          DSHTUI_ALPHA_VERSION="${{ needs.detect.outputs.latest }}" \
            bash scripts/ci-live-smoke.sh

  # ---------------------------------------------------------------------------
  # 无新 alpha → no-op（保留 job 以便查看 status）
  # ---------------------------------------------------------------------------
  noop:
    needs: detect
    if: needs.detect.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "官方 alpha 未变化（${{ needs.detect.outputs.latest }}），本次无操作"
