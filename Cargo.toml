[package]
name = "dshtui"
version = "0.1.0"
edition = "2021"
description = "dshtui — 官方 dsh web Remote API 的 Rust TUI 客户端（V0.1 核心底座）"
license = "MIT"
repository = ""
rust-version = "1.80"

# 依赖清单对齐 Notes/02-architecture.md §5（ratatui/crossterm/tokio/reqwest/
# tokio-tungstenite/nucleo/toml/tracing/thiserror），不引入计划外框架。
[lib]
name = "dshtui"
path = "src/lib.rs"

[[bin]]
name = "dshtui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
tokio-tungstenite = "0.24"
http = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo = "0.5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1"
ratatui-markdown = "0.3.6"
pulldown-cmark = "0.13.4"
syntect = "5.3.0"
arboard = "3.6.1"
open = "5.4.3"
# REQ-004 V0.2 图片（ADR-005：ratatui-image kitty 后端；image 版本与
# ratatui-image 0.10 锁定同版，避免 DynamicImage 类型分裂）
image = { version = "0.24.5", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-image = "0.10"
base64 = "0.22"
lru = "0.12"
# REQ-009 kitty `o=z` 帧压缩（zlib deflate，miniz_oxide 纯 Rust 后端）——
# 2.5MB 全量帧 → ~400KB，RSS <20MB 与帧率预算的关键（2026-09-07 实测）。
flate2 = "1"

[dev-dependencies]

[profile.release]
opt-level = 2
